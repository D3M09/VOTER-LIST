name: Convert PDFs to JSON

on:
  push:
    branches: [main]
    paths:
      - 'pdf/**'
      - 'pdf2json.py'
      - 'jsonmap.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pypdf==6.21.4

      - name: Extract every PDF under pdf/
        run: python pdf2json.py -o json

      - name: Commit JSON output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update JSON outputs [skip ci]"
            git push
          fi
